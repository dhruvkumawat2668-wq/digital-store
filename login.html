<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Portal Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
    .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0070f3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Team Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://rukjoddkwmjpgktaajcm.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1a2pvZGRrd21qcGdrdGFhamNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NjM1MjQsImV4cCI6MjEwODEzOTUyNH0.T31pwHWbulTctAOEgR9_Q0OSkHm0r9S4I9K3UyrDAUM";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      // Fetch all users from Supabase
      const { data: users, error } = await _supabase.from('users').select('*');

      if (error) {
        alert('Database Error: ' + error.message);
        return;
      }

      const matchedUser = users.find(u => u.email === emailInput && u.password === passwordInput);

      if (matchedUser) {
        localStorage.setItem('user', JSON.stringify(matchedUser));
        
        // Proper Case-Insensitive Role Check for Admin
        if (matchedUser.role && matchedUser.role.toString().toLowerCase() === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } else {
        alert('Invalid Email or Password! Please check spelling.');
      }
    });
  </script>
</body>
</html>
